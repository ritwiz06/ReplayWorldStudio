[project]
name = "replay-world-contracts"
version = "0.3.0"
description = "Versioned world contracts (Pydantic source of truth) for Replay World Studio."
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic==2.14.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "replay_world_contracts"
module-root = "python"
