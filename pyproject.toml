# uv workspace root. `uv sync` installs every Python member plus the shared dev tools.
[project]
name = "replay-world-studio"
version = "0.1.0"
description = "Workspace root for Replay World Studio Python packages."
requires-python = ">=3.14,<3.15"
dependencies = [
    "replay-world-contracts",
    "replay-world-api",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.uv]
package = false
required-version = ">=0.12.0"

[tool.uv.workspace]
members = ["packages/contracts", "services/api"]

[tool.uv.sources]
replay-world-contracts = { workspace = true }
replay-world-api = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages/contracts/tests", "services/api/tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["prompts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = [
    "packages/contracts/python",
    "packages/contracts/tests",
    "services/api/src",
    "services/api/tests",
]
explicit_package_bases = true
mypy_path = ["packages/contracts/python", "services/api/src"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
