[project]
name = "replay-world-api"
version = "0.3.0"
description = "Local FastAPI service for Replay World Studio."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.143.0",
    "replay-world-contracts",
    "uvicorn==0.54.0",
]

[tool.uv.sources]
replay-world-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "replay_world_api"
