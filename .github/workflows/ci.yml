name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Contracts, lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Install locked dependencies
        run: |
          uv sync --locked
          pnpm install --frozen-lockfile

      - name: Generated contracts match the Pydantic source
        run: pnpm contracts:check

      - name: Catalog models and demo fixture rebuild byte-for-byte
        run: |
          pnpm assets:check
          pnpm fixtures:check

      - name: Lint
        run: pnpm lint

      - name: Type check (TypeScript + mypy)
        run: pnpm typecheck

      - name: Unit, schema and API tests (Vitest + pytest)
        run: pnpm test

      - name: Build web app
        run: pnpm build

  browser-smoke:
    # Six Playwright tests against the real API and Vite servers: the demo loads with verified
    # models, the edit -> undo/redo -> save -> reopen path, unsaved-change protection, an idle
    # scene is not re-rendered, a described object is checked, placed, saved, reopened and its
    # missing model rebuilt, and a language edit is shown exactly before it is applied. Language
    # answers are recorded live answers replayed offline (never a call to the provider). CI has
    # no GPU, so WebGL runs in software (SwiftShader): this checks behaviour, never frame rate.
    # The full suite runs locally with `pnpm test:e2e`.
    name: Browser smoke test (Playwright, software WebGL)
    runs-on: ubuntu-latest
    # 22 smoke tests and the local journey take 8-12 min in software WebGL; the browser's
    # system libraries usually install in under a minute, but apt downloads have stalled for 8
    # and 11 min (ENR-01's runs), so the job has room for one such stall.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Install locked dependencies
        run: |
          uv sync --locked
          pnpm install --frozen-lockfile

      - name: Install Playwright's headless Chromium and its system libraries
        run: pnpm --filter @replay-world/web exec playwright install --with-deps chromium --only-shell

      - name: Browser smoke tests
        run: pnpm test:e2e:smoke

      - name: Local v0.1 journey on the pnpm start build (no .env, no key)
        run: pnpm --filter @replay-world/web test:e2e:local

      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 7

  public-preview:
    # The dormant hosted mode (ADR-054, ADR-056; superseded as the release by ADR-058, kept tested): the container image builds, its server runs as
    # rws (never root) on a root-owned volume and answers with AI off, and the public journeys
    # pass against that container as anonymous visitors (the sample's move-and-check, DXF, PDF
    # page and plan picture saved and reopened by another visitor, cross-visitor isolation, the
    # API unreachable). Software WebGL: behaviour only.
    name: Public preview (container and production-build journeys)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Build the container image
        run: docker build -t replay-world-studio:ci .

      - name: Run it on a root-owned volume (as Railway mounts one) with a key in its environment
        run: |
          docker volume create rws-data
          docker run --rm -v rws-data:/data --entrypoint chown replay-world-studio:ci 0:0 /data
          docker run -d --name rws -p 8000:8000 -e VOYAGER_API_KEY=ci-placeholder-not-a-key -v rws-data:/data replay-world-studio:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          # The HTTP server runs as rws (uid 10001), never root, and owns the volume.
          docker logs rws 2>&1 | grep -q "Public preview: running as uid 10001; data in /data (a mounted volume"
          docker exec rws grep -Eq '^Uid:[[:space:]]+10001[[:space:]]+10001[[:space:]]+10001[[:space:]]+10001$' /proc/1/status
          test "$(docker exec rws stat -c %u /data)" = 10001
          if docker run --rm --user 0 --entrypoint /app/.venv/bin/python replay-world-studio:ci -m replay_world_api; then echo "it served as root"; exit 1; fi
          # AI stays off: the status says so, and every AI request is refused.
          curl -sf http://127.0.0.1:8000/api/v1/assist/status | grep -q '"available":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"description":"a table"}' http://127.0.0.1:8000/api/v1/assist/object-proposals)" = 503
          if docker exec rws test -e /app/.env; then echo "a .env file is in the image"; exit 1; fi
          if docker exec rws sh -c 'grep -lq ci-placeholder-not-a-key /app/web/assets/*'; then echo "the key reached the web bundle"; exit 1; fi

      - name: Install locked dependencies and Playwright's Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @replay-world/web exec playwright install --with-deps chromium --only-shell

      - name: Public journeys against the container
        run: pnpm --filter @replay-world/web test:e2e:public
        env:
          PUBLIC_URL: http://127.0.0.1:8000

      - name: The server's logs hold no uploaded file names and no key
        run: |
          docker logs rws > server.log 2>&1
          if grep -E "my-hall|my-cell|ci-placeholder-not-a-key" server.log; then echo "a private name or the key reached the logs"; exit 1; fi

      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-preview-test-results
          path: apps/web/test-results/
          retention-days: 7
