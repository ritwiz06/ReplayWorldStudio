name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Contracts, lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Install locked dependencies
        run: |
          uv sync --locked
          pnpm install --frozen-lockfile

      - name: Generated contracts match the Pydantic source
        run: pnpm contracts:check

      - name: Catalog models and demo fixture rebuild byte-for-byte
        run: |
          pnpm assets:check
          pnpm fixtures:check

      - name: Lint
        run: pnpm lint

      - name: Type check (TypeScript + mypy)
        run: pnpm typecheck

      - name: Unit, schema and API tests (Vitest + pytest)
        run: pnpm test

      - name: Build web app
        run: pnpm build

  browser-smoke:
    # Six Playwright tests against the real API and Vite servers: the demo loads with verified
    # models, the edit -> undo/redo -> save -> reopen path, unsaved-change protection, an idle
    # scene is not re-rendered, a described object is checked, placed, saved, reopened and its
    # missing model rebuilt, and a language edit is shown exactly before it is applied. Language
    # answers are recorded live answers replayed offline (never a call to the provider). CI has
    # no GPU, so WebGL runs in software (SwiftShader): this checks behaviour, never frame rate.
    # The full suite runs locally with `pnpm test:e2e`.
    name: Browser smoke test (Playwright, software WebGL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Install locked dependencies
        run: |
          uv sync --locked
          pnpm install --frozen-lockfile

      - name: Install Playwright's headless Chromium and its system libraries
        run: pnpm --filter @replay-world/web exec playwright install --with-deps chromium --only-shell

      - name: Browser smoke tests
        run: pnpm test:e2e:smoke

      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 7

  public-preview:
    # The release candidate (ADR-054): the container image builds, its server answers with AI
    # off, and the public journeys pass against that container as anonymous visitors (the
    # sample's move-and-check, DXF and plan picture saved and reopened by another visitor,
    # cross-visitor isolation, the API unreachable). Software WebGL: behaviour only.
    name: Public preview (container and production-build journeys)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Build the container image
        run: docker build -t replay-world-studio:ci .

      - name: Run it with a key in its environment (it must stay unused)
        run: |
          docker run -d --name rws -p 8000:8000 -e VOYAGER_API_KEY=ci-placeholder-not-a-key replay-world-studio:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/api/v1/assist/status | grep -q '"available":false'
          if docker exec rws test -e /app/.env; then echo "a .env file is in the image"; exit 1; fi
          if docker exec rws sh -c 'grep -lq ci-placeholder-not-a-key /app/web/assets/*'; then echo "the key reached the web bundle"; exit 1; fi

      - name: Install locked dependencies and Playwright's Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @replay-world/web exec playwright install --with-deps chromium --only-shell

      - name: Public journeys against the container
        run: pnpm --filter @replay-world/web test:e2e:public
        env:
          PUBLIC_URL: http://127.0.0.1:8000

      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-preview-test-results
          path: apps/web/test-results/
          retention-days: 7
